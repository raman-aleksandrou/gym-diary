<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Дневник тренировок</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2b303b;--tx:#e8eaf0;--mut:#8b93a5;--acc:#f59e0b;--blue:#2563eb;--red:#dc2626;--green:#16a34a;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.96);backdrop-filter:blur(6px);padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:56px;resize:vertical}
button{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
button.pri{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
button.sm{padding:5px 9px;font-size:13px}
main{padding:12px 12px 90px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.mut{color:var(--mut);font-size:13px}
.h2{font-size:16px;font-weight:700;margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px}
.chip.on{background:var(--acc);color:#111;border-color:var(--acc)}
.mchip{font-size:11px;padding:2px 7px;border-radius:999px;background:#2a2f3a;color:#c9cfdb}
nav{position:fixed;bottom:0;left:0;right:0;background:#12151b;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;border:0;border-radius:0;background:none;padding:10px 0 12px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
nav button b{display:block;font-size:19px;line-height:1.2}
nav button.on{color:var(--acc)}
.ex-h{display:flex;align-items:flex-start;gap:8px}
.ex-h .t{flex:1;font-weight:600}
.set{display:grid;grid-template-columns:26px 1fr 1fr 44px 44px;gap:6px;align-items:center;margin:6px 0;padding:6px;border-radius:10px;border:1px solid var(--line);background:var(--card2)}
.set.done{border-color:var(--blue);background:rgba(37,99,235,.18)}
.set.fail{border-color:var(--red);background:rgba(220,38,38,.18)}
.set .n{color:var(--mut);text-align:center;font-size:13px}
.set input{padding:8px 6px;text-align:center}
.set .lbl{font-size:10px;color:var(--mut);text-align:center;margin-bottom:2px}
.ok,.no{height:40px;padding:0;font-size:18px}
.ok.on{background:var(--blue);border-color:var(--blue);color:#fff}
.no.on{background:var(--red);border-color:var(--red);color:#fff}
.plan{font-size:12px;color:var(--mut)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--card);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px 28px;max-width:640px;margin:0 auto}
.banner{background:#3b2a0b;border:1px solid #6b4b12;color:#fcd38a;padding:8px 10px;border-radius:10px;font-size:13px;margin-bottom:10px}
.hist{border-left:3px solid #4b5262}
.hist.app{border-left-color:var(--acc)}
.list-i{padding:10px 0;border-bottom:1px solid var(--line)}
.list-i:last-child{border-bottom:0}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:#2a2f3a;color:#aab}
.ana p{margin:6px 0}
.ana .warn{color:#fca5a5}.ana .good{color:#86efac}
svg text{fill:var(--mut);font-size:10px}
.figs{display:flex;gap:8px;justify-content:center}
.figs>div{flex:1;text-align:center;background:var(--card2);border-radius:12px;padding:6px}
.ph{width:100%;border-radius:10px;display:block}
.status{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<header><h1 id="ttl">Дневник</h1><select id="profSel" style="width:auto;max-width:42%"></select></header>
<main id="app"><div class="card mut">Загрузка…</div></main>
<nav id="nav"></nav>
<div id="sheetRoot"></div>

function mapName(s){s=(s||"").toLowerCase();
 const has=(...w)=>w.every(x=>s.includes(x));
 if(has("подъем ног")||has("подьем ног")||has("подъём ног"))return "hang_raise";
 if(s.includes("скруч")||s.includes("пресс"))return "crunch";
 if(has("жим")&&(s.includes("наклон"))&&s.includes("гант"))return "incline_db";
 if(has("жим")&&(s.includes("штанг")||s.includes("горизонт")))return "bench";
 if(s.includes("развод")||s.includes("разведен")){ if(s.includes("сторон")||s.includes("стоя"))return "lat_raise"; return "fly";}
 if(has("жим")&&s.includes("плеч"))return s.includes("тренаж")?"ohp_machine":"db_ohp";
 if(s.includes("подтяг"))return "pullup";
 if(s.includes("тяга")&&(s.includes("голов")||s.includes("груди")))return "close_pulldown";
 if(s.includes("гребл")||s.includes("блины"))return "plate_row";
 if(s.includes("гипер"))return "hyper";
 if(s.includes("станов"))return "deadlift";
 if(s.includes("трапец")||s.includes("шраг"))return "shrug";
 if(s.includes("задн")||s.includes("пучок"))return "rear_delt";
 if(s.includes("протяжк")||s.includes("тяга штанги вверх"))return "upright";
 if(s.includes("молот"))return "hammer";
 if(s.includes("бицепс")&&(s.includes("штанг")||s.includes("гриф")))return "bb_curl";
 if(s.includes("бицепс")&&s.includes("сидя")&&!s.includes("тренаж"))return "db_curl";
 if(s.includes("бицепс")||s.includes("сидя тренажер"))return "machine_curl";
 if(s.includes("кроссовер")&&!s.includes("пучок"))return "cable_curl";
 if(s.includes("трицеп")||s.includes("трос")||s.includes("палка"))return "pushdown";
 if(s.includes("вперёд")||s.includes("вперед"))return "front_raise";
 if(s.includes("присед"))return "squat";
 if(s.includes("платформ"))return "leg_press";
 return null;}

/* ===================== Локальное хранилище (IndexedDB) ===================== */
const LDB=(()=>{let dbp=null;const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open("gymdiary",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
 const tx=async(mode,fn)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction("kv",mode);const st=t.objectStore("kv");const out=fn(st);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})};
 const doc=path=>({path,get:async()=>{const v=await tx("readonly",s=>s.get(path));return{id:path.split("/").pop(),exists:v!==undefined,data:()=>v}},set:async d=>{await tx("readwrite",s=>s.put(JSON.parse(JSON.stringify(d)),path))},delete:async()=>{await tx("readwrite",s=>s.delete(path))},collection:x=>col(path+"/"+x)});
 const col=path=>({path,doc:id=>doc(path+"/"+id),get:async()=>{const d=await open();const n=path.split("/").length+1;return new Promise((res,rej)=>{const out=[];const t=d.transaction("kv","readonly");const r=t.objectStore("kv").openCursor(IDBKeyRange.bound(path+"/",path+"/\uffff"));r.onsuccess=()=>{const c=r.result;if(c){if(String(c.key).split("/").length===n){const k=c.key,v=c.value;out.push({id:String(k).split("/").pop(),exists:true,data:()=>v})}c.continue()}else res({docs:out,size:out.length,empty:!out.length})};r.onerror=()=>rej(r.error)})}});
 return{doc,collection:col,all:async()=>{const d=await open();return new Promise(res=>{const out={};const r=d.transaction("kv","readonly").objectStore("kv").openCursor();r.onsuccess=()=>{const c=r.result;if(c){out[c.key]=c.value;c.continue()}else res(out)}})}}})();

 ${onSwap?`<div class="h2" style="margin-top:12px">Замена</div><div class="chips">${e.alt.filter(a=>LIB[a]).map(a=>`<button class="sm" data-a="${a}">${esc(LIB[a].n)}</button>`).join("")}</div>`:""}`,
 s=>{s.querySelector("#cx").onclick=closeSheet;s.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{onSwap(b.dataset.a);closeSheet()});
  const f=s.querySelector("#phf");if(f)f.onchange=async()=>{const file=f.files[0];if(!file)return;const url=await shrink(file);const ph=(L.photos||[]).slice(-1);ph.push(url);S.lib[id]={photos:ph};if(ONLINE){try{await db.doc("lib/"+id).set({photos:ph});toast("Фото сохранено")}catch(e){toast("Не сохранилось: "+e.code)}}exSheet(id,onSwap)}})}
function shrink(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const k=Math.min(1,480/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.7))};img.src=URL.createObjectURL(file)})}
/* ===================== История и подсказка веса ===================== */
function sessionsFor(exId){const p=prof();const out=[];
 if(p.hist)S.hist.forEach(h=>h.ex.forEach(e=>{if(mapName(e.name)===exId){const ws=e.sets.map(s=>num(s.w)).filter(x=>x!=null);if(ws.length)out.push({date:h.date,top:Math.max(...ws),sets:e.sets,src:"hist"})}}));
 S.workouts.filter(w=>w.profile===p.id).forEach(w=>w.ex.forEach(e=>{if(e.id===exId){const done=e.sets.filter(s=>s.st!=="plan"&&num(s.w)!=null);if(done.length)out.push({date:w.date,top:Math.max(...done.map(s=>num(s.w))),sets:done,src:"app",fails:e.sets.filter(s=>s.st==="fail").length,ok:e.sets.filter(s=>s.st==="done").length})}}));
 return out.sort((a,b)=>a.date.localeCompare(b.date))}
function lastOf(id){const app=S.workouts.filter(w=>w.profile===prof().id&&w.id!==(S.cur&&S.cur.id)).sort((a,b)=>b.date.localeCompare(a.date));
 for(const w of app){const e=w.ex.find(x=>x.id===id);if(e&&e.sets.some(s=>s.st!=="plan"))return{w,e}}return null}
function lastText(id){const l=lastOf(id);if(!l)return"";const d=l.w.date.slice(8,10)+"."+l.w.date.slice(5,7);
 return"Прошлый раз "+d+": "+l.e.sets.filter(s=>s.st!=="plan").map(s=>(s.w||"—")+"×"+(s.r||0)+(s.st==="fail"?"✗":"")).join(", ")}
function suggest(spec){const[id,sets,lo,hi,start,inc]=spec;
 const app=S.workouts.filter(w=>w.profile===prof().id&&w.id!==(S.cur&&S.cur.id)).sort((a,b)=>b.date.localeCompare(a.date));
 const hist=[];for(const w of app){const e=w.ex.find(x=>x.id===id);if(e&&e.sets.some(s=>s.st!=="plan"))hist.push(e);if(hist.length>=2)break}
 if(!hist.length)return{w:start,why:start===""?"первая тренировка — подбери рабочий вес":"стартовый вес"};
 const last=hist[0];const ws=last.sets.filter(s=>s.st!=="plan");const done=ws.filter(s=>s.st==="done");
 const w=Math.max(...(done.length?done:ws).map(s=>num(s.w)??0))||start;
 const allTop=ws.length>=sets&&ws.every(s=>s.st==="done"&&num(s.r)>=hi);
 const wayOver=allTop&&ws.every(s=>num(s.r)>=hi+3);
 const missLo=e=>e.sets.some(s=>s.st==="fail"||(s.st==="done"&&num(s.r)<lo));
 if(wayOver&&inc)return{w:+(w+2*inc).toFixed(2),why:`+${2*inc} кг: перевыполнил — ${hi+3}+ повторов во всех подходах`};
 if(allTop&&inc)return{w:+(w+inc).toFixed(2),why:`+${inc} кг: в прошлый раз ${hi} во всех подходах`};
 if(hist.length>=2&&missLo(hist[0])&&missLo(hist[1]))return{w:+(w*0.9).toFixed(1),why:"−10%: дважды подряд не добрал повторы"};
 if(missLo(hist[0]))return{w,why:"в прошлый раз не добрал — тот же вес, добери повторы"};
 return{w,why:"тот же вес, добавь повторы"}}

function mockAnalysis(){const p=prof();const keys=["bench","incline_db","pullup","bb_curl","db_ohp","ohp_machine","squat","deadlift","plate_row","lat_raise"];let out=[];let plat=0;
 keys.forEach(k=>{const s=sessionsFor(k);if(s.length<4)return;const best=Math.max(...s.map(x=>x.top));const firstBest=s.find(x=>x.top===best);const days=Math.round((Date.now()-new Date(firstBest.date))/864e5);
  const last=s[s.length-1];const start=s[0];

  else out.push(`<p class="good">✓ <b>${LIB[k].n}</b>: рекорд ${best} кг ${fmtD(firstBest.date)} (было ${start.top} кг ${fmtD(start.date)}).</p>`)});

 if(ok+fl)out.push(`<p>Выполнено подходов в приложении: <b>${ok}</b>, не выполнено: <b>${fl}</b> (${Math.round(fl/(ok+fl)*100)}%).${fl/(ok+fl)>.2?' <span class="warn">Много срывов — проверь стартовые веса и сон.</span>':""}</p>`);
 const ms=S.metrics.filter(m=>m.profile===p.id);const bad=ms.filter(m=>(m.tags||[]).some(t=>["болел","плохо спал","алкоголь"].includes(t)));
 if(ms.length)out.push(`<p>Записей самочувствия: ${ms.length}; из них с пометками «болел/плохо спал/алкоголь»: ${bad.length}.</p>`);else out.push(`<p class="mut">Добавь записи на вкладке «Самочувствие» — анализ сможет связать сон и болезни с результатами.</p>`);

 if(!w1.kcal&&!w1.weight)return`<div class="card"><div class="h2">Неделя</div><div class="mut">Вноси утренний вес в блоке «❤️ Самочувствие» на тренировке — через неделю тут появятся средние и подсказка, попадаешь ли ты в цель.</div></div>`;
 let hint="";
 if(w1.weight&&w0.weight&&w1.weight.n>=3&&w0.weight.n>=3){const dw=w1.weight.v-w0.weight.v,pct=dw/w0.weight.v*100,goal=(p.calc||{}).goal||"keep";
  const ok=goal==="cut"?pct<=-0.4&&pct>=-0.9:goal==="bulk"?dw>=0.1&&dw<=0.45:Math.abs(pct)<0.3;
  let adv="";if(!ok){if(goal==="cut")adv=pct>-0.4?"Худеешь медленнее цели — убери 150–200 ккал в день.":"Худеешь слишком быстро — добавь 150–200 ккал, иначе уйдут мышцы.";else if(goal==="bulk")adv=dw<0.1?"Вес не растёт — добавь 150–200 ккал.":"Набираешь слишком быстро — убери 150–200 ккал, лишнее уйдёт в жир.";else adv=dw>0?"Вес растёт — убери 150 ккал.":"Вес падает — добавь 150 ккал."}
  hint=`<div style="margin-top:8px">Вес за неделю: <b>${dw>0?"+":""}${dw.toFixed(1)} кг</b> (${pct>0?"+":""}${pct.toFixed(1)}%). Цель «${GOALN[goal]}»: ${GOALT[goal]}.</div><div style="margin-top:4px;color:${ok?"#16a34a":"#f59e0b"}">${ok?"Темп в норме, ничего не меняй.":adv}</div>`}
 else hint=`<div class="mut" style="margin-top:8px">Для подсказки нужно хотя бы 3 утренних взвешивания за эту и за прошлую неделю.</div>`;
 const f=(a,u,dg)=>a?`${a.v.toFixed(dg)} ${u} <span class="mut">(${a.n} дн.)</span>`:"—";
 return`<div class="card"><div class="h2">Последние 7 дней</div>
 <div>Калории в среднем: ${f(w1.kcal,"ккал",0)}${G?` <span class="mut">· норма ${G.kc}</span>`:""}</div>
 <div>Белок в среднем: ${f(w1.protein,"г",0)}</div>
 <div>Вес в среднем: ${f(w1.weight,"кг",1)}</div>${hint}</div>`}
function rBody(){$("#ttl").textContent="Самочувствие";const p=prof();const d=S.bodyDate||today();
 const m=S.metrics.find(x=>x.profile===p.id&&x.date===d)||{profile:p.id,date:d,tags:[]};
 const list=S.metrics.filter(x=>x.profile===p.id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);
 let h=`<div class="card" style="padding:10px 12px"><button class="sm" id="bback">← ${S.prevTab==="today"&&S.cur?"К тренировке":"Назад"}</button></div><div class="card"><div class="row"><input type="date" id="bd" value="${d}"></div>
 <div class="row" style="margin-top:8px"><div><div class="mut">Вес, кг</div><input inputmode="decimal" id="bw" value="${m.weight??""}"></div><div><div class="mut">Рост, см</div><input inputmode="numeric" id="bh" value="${p.height??""}"></div></div>
 <div class="row" style="margin-top:8px"><div><div class="mut">Сон, ч</div><input inputmode="decimal" id="bs" value="${m.sleep??""}"></div><div><div class="mut">Качество сна 1–5</div><input inputmode="numeric" id="bq" value="${m.sleepQ??""}"></div></div>
 <div style="margin-top:8px"><div class="mut">Состояние 1–5</div><div class="chips" id="mood">${[1,2,3,4,5].map(i=>`<span class="chip ${m.mood===i?"on":""}" data-m="${i}">${i}</span>`).join("")}</div></div>
 <div style="margin-top:8px"><div class="mut">Пометки</div><div class="chips" id="tags">${TAGS.map(t=>`<span class="chip ${(m.tags||[]).includes(t)?"on":""}" data-t="${t}">${t}</span>`).join("")}</div></div>
 <textarea id="bn" placeholder="Заметка" style="margin-top:8px">${esc(m.note||"")}</textarea>
 <button class="pri" id="bsave" style="width:100%;margin-top:10px">Сохранить</button></div>
 <div class="card mut">Калории, белок и калькулятор нормы — на вкладке «Питание».</div>
 <div class="card"><div class="h2">Последние записи</div>${list.length?list.map(x=>`<div class="list-i"><b>${fmtD(x.date)}</b> <span class="mut">${x.weight?x.weight+" кг · ":""}${x.sleep?"сон "+x.sleep+" ч · ":""}${x.mood?"сост. "+x.mood:""}</span><div class="chips">${(x.tags||[]).map(t=>`<span class="tag">${t}</span>`).join("")}</div></div>`).join(""):'<div class="mut">Пока нет записей.</div>'}</div>`;
 $("#app").innerHTML=h;const A=$("#app");
 A.querySelector("#bback").onclick=()=>go(S.prevTab||"today");
 A.querySelector("#bd").onchange=e=>{S.bodyDate=e.target.value;rBody()};
 A.querySelectorAll("[data-m]").forEach(c=>c.onclick=()=>{m.mood=+c.dataset.m;A.querySelectorAll("[data-m]").forEach(x=>x.classList.toggle("on",x===c))});
 A.querySelectorAll("[data-t]").forEach(c=>c.onclick=()=>{m.tags=m.tags||[];const t=c.dataset.t;m.tags=m.tags.includes(t)?m.tags.filter(x=>x!==t):m.tags.concat(t);c.classList.toggle("on")});
 A.querySelector("#bsave").onclick=async()=>{Object.assign(m,{weight:num(A.querySelector("#bw").value),sleep:num(A.querySelector("#bs").value),sleepQ:num(A.querySelector("#bq").value),note:A.querySelector("#bn").value});
  const hh=num(A.querySelector("#bh").value);if(hh!==p.height){p.height=hh;saveSettings()}
  if(!S.metrics.includes(m))S.metrics.push(m);await saveMetric(JSON.parse(JSON.stringify(m)));go(S.prevTab||"today")}}
/* ===================== Экран: ещё ===================== */
function rMore(){$("#ttl").textContent="Настройки";const st=S.settings;
 let h=`<div class="card"><div class="h2">Программа — ${esc(prof().name)}</div><select id="pg">${["m","f","u"].map(g=>`<optgroup label="${PGROUP[g]}">${Object.entries(PROGRAMS).filter(([k,v])=>v.g===g).map(([k,v])=>`<option value="${k}" ${k===progOf()?"selected":""}>${esc(v.n)}</option>`).join("")}</optgroup>`).join("")}</select>
 ${(()=>{const P=PROGRAMS[progOf()];return`<div style="margin-top:8px">${esc(P.d||"")}</div><div class="mut" style="margin-top:4px">${PGROUP[P.g]} · ${esc(P.lvl||"")} · ${P.dpw} дн./нед. · ${P.days.length} тренировок в цикле</div><div class="mut" style="margin-top:4px">${P.days.map(d=>esc(d.n)).join(" · ")}</div>`})()}
 <div class="mut" style="margin-top:6px">Программа своя у каждого профиля. Переключи профиль вверху, чтобы выбрать программу для другого человека.</div>
 <div class="mut" style="margin-top:6px">Вес на будущий день считается сам: верх диапазона во всех подходах → +шаг; дважды не добрал → −10%.</div></div>
 <div class="card"><div class="h2">Профили</div>${st.profiles.map((p,i)=>`<div class="row" style="margin-bottom:8px"><input data-pn="${i}" value="${esc(p.name)}"><label class="mut" style="flex:0 0 auto"><input type="checkbox" data-ph="${i}" ${p.hist?"checked":""} style="width:auto"> история 2026</label></div>`).join("")}
 <button class="sm" id="addP">+ профиль</button></div>
 <div class="card"><div class="h2">Самочувствие и вес</div><div class="mut" style="margin-bottom:6px">Обычно отмечается прямо в тренировке. Здесь — все записи и дни без тренировок.</div><button class="sm" id="wellAll">❤️ Открыть</button></div>
 <div class="card"><div class="h2">Залы</div><div class="chips">${st.gyms.map((g,i)=>`<span class="chip">${esc(g)} <span data-gx="${i}" style="cursor:pointer">✕</span></span>`).join("")}</div><button class="sm" id="addG" style="margin-top:8px">+ зал</button></div>
 <div class="card"><div class="h2">Данные</div><div class="mut" style="margin-bottom:8px">Бэкап, перенос на новый телефон, загрузка истории из заметок</div>
 <div class="row"><button class="sm" id="exp">⬇ Экспорт</button><label class="sm" style="flex:1"><span style="display:block;text-align:center;border:1px solid var(--line);border-radius:10px;padding:5px 9px;background:var(--card2)">⬆ Импорт файла</span><input type="file" id="imp" accept=".json,application/json" style="display:none"></label></div>
 <div class="mut" style="margin-top:6px">История в приложении: ${S.hist.length} тренировок из заметок</div></div>
 <div class="card"><div class="h2">Упражнения</div><div class="mut" style="margin-bottom:6px">Карта мышц, техника, фото, замены</div><button class="sm" id="lib">Открыть справочник</button></div>
 <div class="card mut">Данные хранятся только на этом телефоне и работают без интернета. Делай экспорт для бэкапа.</div>`;
 $("#app").innerHTML=h;const A=$("#app");
 A.querySelector("#wellAll").onclick=()=>{S.bodyDate=today();go("body")};
 A.querySelector("#pg").onchange=e=>{const p=prof();p.program=e.target.value;st.nextDay=st.nextDay||{};st.nextDay[p.id]=0;saveSettings();rMore();toast("Программа выбрана")};
 A.querySelectorAll("[data-pn]").forEach(i=>{i.oninput=()=>{st.profiles[+i.dataset.pn].name=i.value.trim()||"Без имени";renderProf()};i.onchange=()=>{saveSettings();toast("Имя сохранено")}});
 A.querySelectorAll("[data-ph]").forEach(i=>i.onchange=()=>{st.profiles[+i.dataset.ph].hist=i.checked;saveSettings()});
 A.querySelector("#addP").onclick=()=>{st.profiles.push({id:"p"+Date.now().toString(36),name:"Новый",height:null,hist:false});saveSettings();renderProf();rMore()};
 A.querySelectorAll("[data-gx]").forEach(x=>x.onclick=()=>{st.gyms.splice(+x.dataset.gx,1);saveSettings();rMore()});
 A.querySelector("#addG").onclick=()=>gymDialog(()=>rMore());
 A.querySelector("#lib").onclick=()=>pickEx(id=>exSheet(id));
 A.querySelector("#exp").onclick=async()=>{const all=await LDB.all();const blob=new Blob([JSON.stringify({app:"gym-diary",v:1,exported:new Date().toISOString(),data:all})],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="gym-diary-"+today()+".json";document.body.appendChild(a);a.click();a.remove();try{localStorage.setItem("gd_lastExport",Date.now())}catch(e){};toast("Файл сохранён в Загрузки")};
 A.querySelector("#imp").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());let n=0;
  if(j.app==="gym-diary"&&j.data){for(const[k,v]of Object.entries(j.data)){await LDB.doc(k).set(v);n++}toast("Импортировано записей: "+n)}
  else if(Array.isArray(j.items)){const cur=S.hist.slice();const keys=new Set(cur.map(x=>x.date+x.title));j.items.forEach(x=>{if(!keys.has(x.date+x.title)){cur.push(x);n++}});await LDB.doc("hist/all").set({items:cur});toast("История: добавлено "+n+" тренировок")}
  else{toast("Не тот формат файла");return}
  setTimeout(()=>location.reload(),900)}catch(err){toast("Ошибка импорта: "+err.message)}}}
renderNav();loadAll();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
